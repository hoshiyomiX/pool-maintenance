name: Android CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK (signed with testkey)
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: APK size comparison
        if: success()
        run: |
          echo "=== APK Size Report ==="
          DEBUG_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo "0")
          RELEASE_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk 2>/dev/null || echo "0")
          DEBUG_MB=$(echo "scale=2; $DEBUG_SIZE / 1048576" | bc)
          RELEASE_MB=$(echo "scale=2; $RELEASE_SIZE / 1048576" | bc)
          SAVED_PCT=$(echo "scale=1; ($DEBUG_SIZE - $RELEASE_SIZE) * 100 / $DEBUG_SIZE" | bc)
          echo "Debug APK:   ${DEBUG_MB} MB"
          echo "Release APK: ${RELEASE_MB} MB (R8 + resource shrinking)"
          echo "Size saved:  ${SAVED_PCT}%"

      - name: Verify release APK signature
        if: success()
        run: |
          echo "=== Verifying APK signature ==="
          ${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || \
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || \
          echo "apksigner not found, skipping verification"
