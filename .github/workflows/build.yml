name: Android CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: APK size comparison
        if: success()
        run: |
          echo "=== APK Size Comparison ==="
          DEBUG_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          RELEASE_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Debug APK:   $(awk \"BEGIN{printf \\\"%.2f\\\", $DEBUG_SIZE/1048576}\") MB"
          echo "Release APK: $(awk \"BEGIN{printf \\\"%.2f\\\", $RELEASE_SIZE/1048576}\") MB"
          echo "Reduction:   $(awk \"BEGIN{printf \\\"%.1f\\\", (1-$RELEASE_SIZE/$DEBUG_SIZE)*100}\")%"

      - name: Build info
        if: success()
        run: |
          echo "Build completed successfully!"
          echo "Debug:   app/build/outputs/apk/debug/app-debug.apk"
          echo "Release: app/build/outputs/apk/release/app-release-unsigned.apk"
